[package]
name = "save-customer"
version = "0.1.0"
edition = "2021"

[dependencies]
wit-bindgen-rt = { version = "0.39.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
opt-level = "s"
strip = true
lto = true

[package.metadata.component]
package = "app:customer"

[package.metadata.component.target.dependencies]
"app:caps" = { path = "wit/deps/caps" }
